[project]
name = "f1-strategy-predictor"
version = "0.1.0"
description = "Predicts which race Strategies F1 drivers are likely to be on."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastf1>=3.8.3",
]

[project.scripts]
f1-strategy = "f1_strategy.cli:main"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1_strategy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "slow: real-data tests that load through FastF1 (hit the on-disk cache or, when cold, the live timing API)",
]
