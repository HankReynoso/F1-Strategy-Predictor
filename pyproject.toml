[project]
name = "f1-strategy-predictor"
version = "0.1.0"
description = "Predicts which race Strategies F1 drivers are likely to be on."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1_strategy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
